# Varal: API em host próprio (REST e WebSocket), sem front.
# Mantido em mchlima/varal-infra (nginx/conf.d). Não edite direto no VPS.

server {
    listen 80;
    listen [::]:80;
    server_name api-web-varal.kratinho.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-web-varal.kratinho.com.br;

    # Cloudflare Origin Certificate (*.kratinho.com.br), SSL Full (strict).
    ssl_certificate     /etc/nginx/certs/kratinho.com.br/origin.pem;
    ssl_certificate_key /etc/nginx/certs/kratinho.com.br/origin.key;

    # IP real do cliente a partir do CF-Connecting-IP (spec 01, RN-01.19).
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # A API pode não estar no ar: a variável adia a resolução do nome para
    # cada requisição (DNS do Docker), e o NGINX sobe mesmo assim.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $varal_api http://varal-api:3000;

    location / {
        proxy_pass $varal_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws {
        proxy_pass $varal_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
