# Varal: front do admin (varal-admin-web). A API fica em api-web-varal.kratinho.com.br.
# Mantido em mchlima/varal-infra (nginx/conf.d). Não edite direto no VPS.

server {
    listen 80;
    listen [::]:80;
    server_name admin-varal.kratinho.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin-varal.kratinho.com.br;

    # Cloudflare Origin Certificate (*.kratinho.com.br), SSL Full (strict).
    ssl_certificate     /etc/nginx/certs/kratinho.com.br/origin.pem;
    ssl_certificate_key /etc/nginx/certs/kratinho.com.br/origin.key;

    # IP real do cliente a partir do CF-Connecting-IP (spec 01, RN-01.19).
    include /etc/nginx/snippets/cloudflare-realip.conf;

    root /srv/html/varal-admin/current;
    index index.html;

    # Arquivos do build com hash no nome: cache longo.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: rotas do front caem no index.html, que nunca fica em cache.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
