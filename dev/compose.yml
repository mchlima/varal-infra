# Ambiente de desenvolvimento compartilhado por todos os worktrees:
# - Postgres (spec 01, RN-01.06);
# - Mailpit: servidor SMTP local que guarda os e-mails enviados pela API sem entregá-los
#   (SMTP em localhost:1025, caixa de entrada em http://localhost:8025).
# Cada worktree usa um banco próprio (varal_<slug> e varal_<slug>_test), criado pelo
# scripts/worktree.sh do varal-web-api.
#
# Subir:  docker compose -f dev/compose.yml up -d
# Nunca rode `down -v` nem apague o volume: isso destrói os bancos de todos os agentes.
#
# Credenciais só de desenvolvimento, sem valor fora desta máquina.
name: varal-dev-db

services:
  postgres:
    image: postgres:17
    container_name: varal-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: varal
      POSTGRES_PASSWORD: varal
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varal -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: varal-dev-mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 2000

volumes:
  data:
    name: varal-dev-db-data
