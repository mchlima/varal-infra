# Produção do Varal no VPS (spec 01, seção 4; plano, seção 2.4).
# Instalado em /opt/varal/compose.yml. Usa o PostgreSQL e o NGINX compartilhados do VPS
# (redes externas `postgres` e `proxy`); não define nginx nem postgres (CA-01.13).
# A versão da imagem vem de API_VERSION, definida pelo deploy-api.
name: varal

services:
  api:
    image: varal-web-api:${API_VERSION:?defina API_VERSION}
    container_name: varal-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks:
      - postgres
      - proxy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health | grep -q '\"db\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  postgres:
    name: postgres
    external: true
  proxy:
    name: proxy
    external: true
